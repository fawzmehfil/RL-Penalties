behaviors:
  GoalkeeperRobust-v0:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 5

environment_parameters:
  stage2.lesson:
    curriculum:
      - name: Mechanics
        completion_criteria:
          measure: progress
          behavior: GoalkeeperRobust-v0
          min_lesson_length: 100
          threshold: 0.25
          require_reset: true
        value: 0.0
      - name: HorizontalPlacement
        completion_criteria:
          measure: progress
          behavior: GoalkeeperRobust-v0
          min_lesson_length: 100
          threshold: 0.50
          require_reset: true
        value: 1.0
      - name: Height
        completion_criteria:
          measure: progress
          behavior: GoalkeeperRobust-v0
          min_lesson_length: 100
          threshold: 0.75
          require_reset: true
        value: 2.0
      - name: Speed
        value: 3.0
  stage4.obs_delay_steps: 3.0
  stage4.ball_position_noise_m: 0.04
  stage4.ball_velocity_noise_mps: 0.25
  stage4.keeper_position_noise_m: 0.03
  stage4.dropout_probability: 0.05
