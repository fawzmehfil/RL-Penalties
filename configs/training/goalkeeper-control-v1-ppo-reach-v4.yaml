behaviors:
  GoalkeeperControl-v1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 32768
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 8000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 8

environment_parameters:
  stage5.reach_training_enabled: 1.0
  stage5.reach_training_version: 4.0
  stage5.lesson:
    curriculum:
      - name: PolicyTiming
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v1
          min_lesson_length: 100
          threshold: 0.10
          require_reset: true
        value: 0.0
      - name: PolicyAimAndReach
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v1
          min_lesson_length: 100
          threshold: 0.25
          require_reset: true
        value: 1.0
      - name: WideAndHighCoverage
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v1
          min_lesson_length: 100
          threshold: 0.45
          require_reset: true
        value: 2.0
      - name: FullRangeTransition
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v1
          min_lesson_length: 100
          threshold: 0.65
          require_reset: true
        value: 3.0
      - name: CanonicalFullRange
        value: 4.0
