behaviors:
  GoalkeeperControl-v2:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 32768
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 250000
    keep_checkpoints: 12

environment_parameters:
  stage5.metrics_version: 5.0
  stage5.reach_training_enabled: 1.0
  stage5.reach_training_version: 5.0
  stage5.lesson:
    curriculum:
      - name: CentralSlow
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v2
          min_lesson_length: 100
          threshold: 0.05
          require_reset: true
        value: 0.0
      - name: LateralSlow
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v2
          min_lesson_length: 100
          threshold: 0.15
          require_reset: true
        value: 1.0
      - name: HeightAndWidth
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v2
          min_lesson_length: 100
          threshold: 0.30
          require_reset: true
        value: 2.0
      - name: FullRangeSlow
        completion_criteria:
          measure: progress
          behavior: GoalkeeperControl-v2
          min_lesson_length: 100
          threshold: 0.50
          require_reset: true
        value: 3.0
      - name: CanonicalFullRange
        value: 4.0
