behaviors:
  GoalkeeperControl-v2:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 32768
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    behavioral_cloning:
      demo_path: results/demonstrations/goalkeeper-control-v2-reactive-demo-v1-20k
      strength: 0.5
      steps: 300000
      batch_size: 1024
      num_epoch: 3
      samples_per_update: 32768
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 11

environment_parameters:
  stage5.metrics_version: 5.0
  stage5.reach_training_enabled: 1.0
  stage5.reach_training_version: 5.0
  stage5.lesson: 4.0
