name: Stage 0 evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: Install test runner
        run: python -m pip install pytest==8.3.5

      - name: Validate committed Stage 0 reports
        run: python -m pytest -q python/tests/test_stage0_reports.py
